name: Bug report
description: Report something that does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: CodeLens version
      description: Output of `codelens --version`
      placeholder: codelens 0.2.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: Python 3.12, macOS 14
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The exact command, for example `codelens map ./my_project`
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output or traceback
      description: Paste any error message here.
      render: text
